name: Build and Package Plugin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Plugin Artifact
        run: |
          mkdir -p out
          zip -r out/WiFi-BandLock.zip plugin.json package.json main.py LICENSE README.md dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-BandLock
          path: out/WiFi-BandLock.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/WiFi-BandLock.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
